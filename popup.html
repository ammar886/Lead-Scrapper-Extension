<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pastry Lead Scraper</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="popup-header">
      <div class="brand">
        <div class="logo-mark">🥐</div>
        <div class="brand-text">
          <h1 class="brand-title">Pastry Scraper</h1>
          <span class="brand-subtitle">Home Service Lead Gen</span>
        </div>
      </div>
      <div id="license-badge" class="badge badge-inactive">Inactive</div>
    </header>

    <!-- Active Tab Status Card -->
    <div class="page-context-card">
      <div class="context-header">
        <span class="context-label">Current Page</span>
        <span id="detected-source-badge" class="badge badge-source">Checking...</span>
      </div>
      <p id="page-title-preview" class="page-title-text">Inspecting active tab...</p>
      
      <button id="quick-extract-btn" class="btn btn-primary btn-block" disabled>
        <span class="btn-icon">⚡</span>
        <span id="quick-extract-label">Extract Leads from Tab</span>
      </button>
      <div id="quick-extract-status" class="status-msg hidden"></div>
    </div>

    <!-- Quick Stats -->
    <div class="quick-stats-grid">
      <div class="stat-box">
        <span class="stat-number" id="popup-total-leads">0</span>
        <span class="stat-name">Total Leads</span>
      </div>
      <div class="stat-box">
        <span class="stat-number" id="popup-dup-leads">0</span>
        <span class="stat-name">Duplicates Prevented</span>
      </div>
    </div>

    <!-- Actions -->
    <div class="popup-footer">
      <button id="open-dashboard-btn" class="btn btn-secondary btn-block">
        <span>Open Lead Dashboard</span>
        <span class="arrow-icon">↗</span>
      </button>
    </div>
  </div>

  <script src="utils/normalize.js"></script>
  <script src="utils/storage.js"></script>
  <script src="utils/license.js"></script>
  <script src="popup.js"></script>
</body>
</html>
